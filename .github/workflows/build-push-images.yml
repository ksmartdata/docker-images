name: Build and Push Images
run-name: Build ${{ inputs.job }}:${{ inputs.tag }} by @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      job:
        description: 'which docker build to run'
        required: true
        type: string
      tag:
        description: 'tag'
        required: true
        type: string
      build-args:
        description: 'build args'
        required: false
        type: string
      context:
        description: 'docker build context, defaults to ./images/<job>'
        required: false
        type: string
      dockerfile:
        description: 'dockerfile path, defaults to ./images/<job>/Dockerfile'
        required: false
        type: string

env:
  ONLINE_REGISTER: ghcr.io/ksmartdata
  BUILD_PLATFORM: linux/amd64,linux/arm64

jobs:
  common-build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0
      - name: Build && Push
        uses: docker/build-push-action@v6.18.0
        with:
          context: ${{ inputs.context || format('./images/{0}', inputs.job) }}
          file: ${{ inputs.dockerfile || format('./images/{0}/Dockerfile', inputs.job) }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: true
          platforms: ${{ env.BUILD_PLATFORM }}
          tags: ${{ env.ONLINE_REGISTER }}/${{ inputs.job }}:${{ inputs.tag }}
          cache-from: type=gha
          build-args: ${{ inputs.build-args }}
          cache-to: type=gha,mode=max
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=Build from ${{ github.ref }} ${{ github.sha }}
